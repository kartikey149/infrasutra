services:
  - type: web
    name: infrasutra-backend
    env: python
    buildCommand: "cd website/backend/ai && pip install -r requirements.txt && python ../data/seed_database.py"
    startCommand: "cd website/backend/ai && uvicorn extraction_service:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_URL
        value: "https://infrasutra.netlify.app"
